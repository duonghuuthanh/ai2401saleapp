{% extends 'admin/master.html' %}

{% block body %}
<h1 class="text-center text-success mt-2">THÔNG KÊ & BÁO CÁO</h1>

<form method="get" action="">
    <div class="mt-3">
        <input type="text" placeholder="Tên sản phẩm..." name="kw" class="form-control" />
    </div>
    <div class="mt-3">
        <div class="row">
            <div class="col-6">
                <select class="form-control" name="time">
                    <option value="month">Theo tháng</option>
                    <option value="quarter">Theo quý</option>
                </select>
            </div>
            <div class="col-6">
                <input type="number" placeholder="Năm" name="year" class="form-control" />
            </div>
        </div>
    </div>
    <div class="mt-3">
        <button class="btn btn-success">Thống kê</button>
    </div>
</form>

<div class="row mt-3">
    <div class="col-6">
        <table class="table">
            <tr>
                <th>Id</th>
                <th>Tên sản phẩm</th>
                <th>Doanh thu</th>
            </tr>
            {% for s in revenue_by_products %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <div class="col-6">
        <canvas id="myChart1"></canvas>
    </div>
</div>

<div class="row mt-3">
    <div class="col-6">
        <table class="table">
            <tr>
                <th>Thời gian</th>
                <th>Doanh thu</th>
            </tr>
            {% for s in revenue_by_time %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <div class="col-6">
        <canvas id="myChart2"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/draw.js') }}"></script>
<script>
    let data = [];
    let labels = [];
    let data2 = [];
    let labels2 = [];

    {% for s in revenue_by_products %}
        data.push({{ s[2] }});
        labels.push('{{ s[1] }}')
    {% endfor %}

     {% for s in revenue_by_time %}
        data2.push({{ s[1] }});
        labels2.push({{ s[0] }})
    {% endfor %}

    window.onload = function() {

         drawChart(data, labels, 'Doanh thu theo sản phẩm', 'bar', 'myChart1');
         drawChart(data2, labels2, 'Doanh thu theo thời gian', 'bar', 'myChart2');
    }
</script>

{% endblock %}
